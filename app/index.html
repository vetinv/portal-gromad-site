<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Портал муніципалітетів</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#17714A"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Портал">
<style>:root{--g:#17714A;--ink:#16241D;--mu:#5C6B63;--bg:#EEF2EE}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);padding:16px}
.box{width:100%;max-width:380px;background:#fff;border:1px solid #D5DDD7;border-radius:18px;padding:28px 24px}.lg{display:flex;gap:12px;align-items:center;margin-bottom:10px}.lg img{width:44px;height:44px;border-radius:10px}h1{font-size:21px;margin:0}
p{color:var(--mu);font-size:14px;margin:0 0 18px;line-height:1.45}input[type=password]{width:100%;margin-bottom:10px;font:inherit;font-size:16px;padding:12px 14px;border:1px solid #C9D3CE;border-radius:12px}
label.r{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mu);margin:12px 0}button{width:100%;font:inherit;font-size:16px;font-weight:600;padding:12px;border:0;border-radius:12px;background:var(--g);color:#fff;cursor:pointer}button:disabled{opacity:.6}
.err{color:#B03A2E;font-size:14px;min-height:20px;margin-top:10px}.st{color:var(--mu);font-size:13px;margin-top:6px;min-height:18px}.ins{display:none;margin-top:14px;background:#E6F2EB;color:#155C36;border:1px solid #BFDCCB}
@media (prefers-color-scheme:dark){:root{--ink:#E6EFE8;--mu:#9FB0A4;--bg:#111613}.box{background:#18201B;border-color:#2A352E}input[type=password]{background:#111613;color:var(--ink);border-color:#2A352E}.ins{background:#1B2E23;color:#7FD3A6;border-color:#2A4A37}}</style></head><body>
<form class="box" id="f"><div class="lg"><img src="icon-192.png" alt=""><h1>Портал муніципалітетів</h1></div><p id="msg">Вхід за паролем. Після входу портал працює і без інтернету; дані й доступ оновлюються самі, коли є інтернет.</p>
<input type="password" id="pw" autocomplete="current-password" placeholder="Пароль" required autofocus>
<button id="b">Увійти</button><div class="err" id="e"></div><div class="st" id="s"></div><button type="button" class="ins" id="ins">Встановити як застосунок</button></form>
<script>
const IT=250000,DAY=864e5;
(function(){
/* Мінімальний raw-inflate (RFC 1951), на основі tiny-inflate (MIT). Розпаковує вбудовані дані порталу синхронно. */
function Tree(){this.t=new Uint16Array(16);this.s=new Uint16Array(288)}
var sl=new Tree(),sd=new Tree(),lb=new Uint8Array(30),lB=new Uint16Array(30),db=new Uint8Array(30),dB=new Uint16Array(30),
clo=new Uint8Array([16,17,18,0,8,7,9,6,10,5,11,4,12,3,13,2,14,1,15]),ct=new Tree(),ln=new Uint8Array(320),off=new Uint16Array(16);
function bases(bits,base,d,f){var i,s;for(i=0;i<d;++i)bits[i]=0;for(i=0;i<30-d;++i)bits[i+d]=i/d|0;for(s=f,i=0;i<30;++i){base[i]=s;s+=1<<bits[i]}}
function fixed(lt,dt){var i;for(i=0;i<7;++i)lt.t[i]=0;lt.t[7]=24;lt.t[8]=152;lt.t[9]=112;for(i=0;i<24;++i)lt.s[i]=256+i;for(i=0;i<144;++i)lt.s[24+i]=i;for(i=0;i<8;++i)lt.s[168+i]=280+i;for(i=0;i<112;++i)lt.s[176+i]=144+i;for(i=0;i<5;++i)dt.t[i]=0;dt.t[5]=32;for(i=0;i<32;++i)dt.s[i]=i}
function build(t,l,o,n){var i,s;for(i=0;i<16;++i)t.t[i]=0;for(i=0;i<n;++i)t.t[l[o+i]]++;t.t[0]=0;for(s=0,i=0;i<16;++i){off[i]=s;s+=t.t[i]}for(i=0;i<n;++i)if(l[o+i])t.s[off[l[o+i]]++]=i}
function D(src){this.s=src;this.i=0;this.tag=0;this.bc=0;this.d=new Uint8Array(src.length*8);this.n=0}
D.prototype.grow=function(k){if(this.n+k>this.d.length){var b=new Uint8Array(Math.max(this.d.length*2,this.n+k));b.set(this.d);this.d=b}};
function bit(d){if(!d.bc--){d.tag=d.s[d.i++];d.bc=7}var b=d.tag&1;d.tag>>>=1;return b}
function rb(d,n,b){if(!n)return b;while(d.bc<24){d.tag|=d.s[d.i++]<<d.bc;d.bc+=8}var v=d.tag&(0xffff>>>(16-n));d.tag>>>=n;d.bc-=n;return v+b}
function sym(d,t){while(d.bc<24){d.tag|=d.s[d.i++]<<d.bc;d.bc+=8}var s=0,c=0,l=0,tag=d.tag;do{c=2*c+(tag&1);tag>>>=1;++l;s+=t.t[l];c-=t.t[l]}while(c>=0);d.tag=tag;d.bc-=l;return t.s[s+c]}
function dyn(d,lt,dt){var hl=rb(d,5,257),hd=rb(d,5,1),hc=rb(d,4,4),i,num,len;for(i=0;i<19;++i)ln[i]=0;for(i=0;i<hc;++i)ln[clo[i]]=rb(d,3,0);build(ct,ln,0,19);
 for(num=0;num<hl+hd;){var s=sym(d,ct);switch(s){case 16:var p=ln[num-1];for(len=rb(d,2,3);len;--len)ln[num++]=p;break;case 17:for(len=rb(d,3,3);len;--len)ln[num++]=0;break;case 18:for(len=rb(d,7,11);len;--len)ln[num++]=0;break;default:ln[num++]=s}}
 build(lt,ln,0,hl);build(dt,ln,hl,hd)}
function blk(d,lt,dt){for(;;){var s=sym(d,lt);if(s===256)return;if(s<256){d.grow(1);d.d[d.n++]=s}else{s-=257;var len=rb(d,lb[s],lB[s]),ds=sym(d,dt),o=d.n-rb(d,db[ds],dB[ds]);d.grow(len);for(var i=o;i<o+len;++i)d.d[d.n++]=d.d[i]}}}
function stored(d){while(d.bc>8){d.i--;d.bc-=8}var len=d.s[d.i+1];len=256*len+d.s[d.i];d.i+=4;d.grow(len);for(var i=len;i;--i)d.d[d.n++]=d.s[d.i++];d.bc=0}
fixed(sl,sd);bases(lb,lB,4,3);bases(db,dB,2,1);lb[28]=0;lB[28]=258;
function inflate(src){var d=new D(src),f,t;do{f=bit(d);t=rb(d,2,0);if(t===0)stored(d);else if(t===1)blk(d,sl,sd);else{var lt=new Tree(),dt=new Tree();dyn(d,lt,dt);blk(d,lt,dt)}}while(!f);return d.d.subarray(0,d.n)}
function utf8(b){if(window.TextDecoder)return new TextDecoder('utf-8').decode(b);var s='',i=0;while(i<b.length){var c=b[i++];if(c>127){if(c>223&&c<240){c=(c&15)<<12|(b[i++]&63)<<6|b[i++]&63}else if(c>191){c=(c&31)<<6|b[i++]&63}else{c=(c&7)<<18|(b[i++]&63)<<12|(b[i++]&63)<<6|b[i++]&63;c-=65536;s+=String.fromCharCode(55296+(c>>10),56320+(c&1023));continue}}s+=String.fromCharCode(c)}return s}
window.inflateRaw=inflate;
})();

let VER=null,OFF=false,DPROMPT=null;
const $=i=>document.getElementById(i),st=t=>{$('s').textContent=t||''};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DPROMPT=e;$('ins').style.display='block'});
$('ins').onclick=async()=>{if(!DPROMPT)return;DPROMPT.prompt();try{await DPROMPT.userChoice}catch(x){}DPROMPT=null;$('ins').style.display='none'};
const LS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},d:k=>{try{localStorage.removeItem(k)}catch(e){}}};
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('pg',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function kget(){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('k').objectStore('k').get('lease');q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)})}catch(e){return null}}
async function kput(v){const d=await idb();await new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,'lease');t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function wipe(){try{const d=await idb();await new Promise(ok=>{const t=d.transaction('k','readwrite');t.objectStore('k').delete('lease');t.oncomplete=ok;t.onerror=ok})}catch(e){}try{await caches.delete('pg-data')}catch(e){}LS.d('pg_pw')}
async function getVer(){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),6000);const r=await fetch('ver.json?t='+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(t);if(r.ok)return await r.json()}catch(e){}return null}
async function getBin(k){const h=VER&&VER.b&&VER.b[k];let c=null;try{c=await caches.open('pg-data')}catch(e){}
  const m=c?await c.match('bin-'+k):null;
  if(h&&(!m||m.headers.get('x-h')!==h)){try{st(m?'Оновлюю дані…':'Завантажую дані (перший раз — до хвилини)…');const r=await fetch(k+'.bin?h='+h,{cache:'no-store'});
      if(r.ok){const b=await r.arrayBuffer();if(c)await c.put('bin-'+k,new Response(b,{headers:{'x-h':h,'x-d':VER.d||''}}));st('');return {b,d:VER.d}}}catch(e){}}
  if(m){OFF=OFF||!h||m.headers.get('x-h')!==h;return {b:await m.arrayBuffer(),d:m.headers.get('x-d')||''}}
  throw new Error(h?'Не вдалося завантажити дані — перевірте інтернет.':'Немає інтернету, а дані ще не збережені на пристрої. Відкрийте портал з інтернетом.')}
async function inflate(u8){if(typeof DecompressionStream!=='undefined'){try{const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(s).text()}catch(e){}}return new TextDecoder().decode(inflateRaw(u8))}
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function derive(pw,role){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const salt=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pg-dk|'+role))).slice(0,16);
  const raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:IT,hash:'SHA-256'},k,256);
  const kv=hex(await crypto.subtle.digest('SHA-256',raw)).slice(0,12);
  const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);return {key,kv}}
async function dec(key,buf){const u=new Uint8Array(buf);const d=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12));return inflate(new Uint8Array(d))}
function binFor(role){const reg=LS.g('pg_reg')||'w',p=role==='v'?'v':'a';return reg==='w'||(VER&&VER.b&&!VER.b[p+'-'+reg])?p:p+'-'+reg}
function ask(t){$('msg').textContent=t;$('b').disabled=false;st('')}
async function login(pw){const e=$('e'),bt=$('b');bt.disabled=true;e.textContent='';st('Перевіряю…');
  VER=await getVer();if(!VER||VER.f!==2){bt.disabled=false;st('');e.textContent='Для входу потрібен інтернет.';return}
  let got=null;for(const role of ['v','a']){const d=await derive(pw,role);if(VER.kv&&VER.kv[role]===d.kv){got={role,...d};break}}
  if(!got){bt.disabled=false;st('');e.textContent='Невірний пароль.';return}
  LS.d('pg_who');LS.d('pg_dev');
  const now=Date.now(),L=(VER.L||30)*DAY;await kput({role:got.role,key:got.key,kv:got.kv,exp:now+L,seen:now,t0:now});LS.d('pg_pw');LS.s('pg_role',got.role==='v'?'v':'a');
  return open_(await kget())}
async function start(){
  const old=LS.g('pg_pw');if(old){LS.d('pg_pw');VER=await getVer();if(VER&&VER.f===2){for(const role of ['v','a']){const d=await derive(old,role);if(VER.kv&&VER.kv[role]===d.kv){const now=Date.now();await kput({role,key:d.key,kv:d.kv,exp:now+(VER.L||30)*DAY,seen:now,t0:now});break}}}}
  const rec=await kget();
  if(!rec)return ask('Вхід за паролем. Після входу портал працює і без інтернету; дані й доступ оновлюються самі, коли є інтернет.');
  const now=Date.now();
  if(now>rec.exp||now<rec.seen-6*3600e3){await wipe();return ask('Строк доступу на цьому пристрої закінчився. Підключіться до інтернету й введіть пароль.')}
  if(!VER)VER=await getVer();
  if(VER&&VER.f===2&&VER.kv){if(VER.kv[rec.role]!==rec.kv){await wipe();return ask('Пароль змінено. Підключіться до інтернету й введіть новий пароль.')}rec.exp=now+(VER.L||30)*DAY}
  rec.seen=Math.max(rec.seen,now);await kput(rec);return open_(rec)}
async function open_(rec){const e=$('e');st('Відкриваю…');let got;
  try{got=await getBin(binFor(rec.role))}catch(x){$('b').disabled=false;st('');e.textContent=x.message;return}
  let html;try{st('Розшифровую…');html=await dec(rec.key,got.b)}catch(x){await wipe();return ask('Дані не відкриваються цим ключем. Підключіться до інтернету й введіть пароль.')}
  const left=Math.ceil((rec.exp-Date.now())/DAY),exd=new Date(rec.exp).toLocaleDateString('uk-UA');
  const note=OFF?`<div id="pgoff" style="position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:999;background:#16241D;color:#fff;padding:8px 14px;border-radius:10px;font:14px system-ui;box-shadow:0 4px 16px rgba(0,0,0,.25)">Без інтернету: дані від ${got.d||'—'}</div><script>setTimeout(()=>{const x=document.getElementById('pgoff');if(x)x.remove()},6000)<\/script>`:'';
  const exp=left<=5?`<div id="pgexp" style="position:fixed;left:0;right:0;top:0;z-index:1000;background:#B7791F;color:#fff;padding:8px max(16px,env(safe-area-inset-left,0px));font:14px system-ui;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap">Доступ на цьому пристрої — до ${exd}. Підключіться до інтернету, щоб продовжити.<button onclick="location.reload()" style="font:inherit;font-weight:600;border:0;border-radius:8px;padding:5px 12px;background:#fff;color:#7A4E0E;cursor:pointer">Оновити</button></div>`:'';
  let sw='';const RL=(VER&&VER.r)||null;const k=binFor(rec.role);const RLx=RL&&RL.filter(r=>r[0]==='w'||(VER.b&&VER.b[(rec.role==='v'?'v-':'a-')+r[0]]));if(RLx&&RLx.length>1){const cur=(k==='a'||k==='v')?'w':k.slice(2);
    sw=`<script>(function(){const R=${JSON.stringify(RLx)},cur=${JSON.stringify(cur)};function mk(id){const s=document.createElement('select');s.id=id;s.title='Регіон';s.style.cssText='margin-left:8px;font:inherit;font-size:15px;padding:10px 12px;border:1px solid #C9D3CE;border-radius:12px;background:#fff;color:#16241D;max-width:230px';
      s.innerHTML=R.map(r=>'<option value="'+r[0]+'"'+(r[0]===cur?' selected':'')+'>'+r[1]+' · '+r[2]+'</option>').join('');
      s.onchange=()=>{try{localStorage.setItem('pg_reg',s.value)}catch(e){}location.reload()};return s}
      function put(){const b=document.getElementById('admBtn')||document.getElementById('srcBtn'),x=document.getElementById('admX');if(b&&!document.getElementById('pgReg'))b.after(mk('pgReg'));if(x&&!document.getElementById('pgReg2')){const s=mk('pgReg2');s.style.marginRight='8px';x.before(s)}const nv=document.querySelector('.p-entries');if(nv&&!document.getElementById('pgReg3')){const w=document.createElement('div');w.style.cssText='margin:0 0 14px;display:flex;gap:10px;align-items:center;font-size:15px';w.innerHTML='<b>Регіон</b>';const s=mk('pgReg3');s.style.marginLeft='0';w.appendChild(s);nv.before(w)
        try{const C=JSON.parse(document.getElementById('data').textContent).c,O=new Set(C.map(c=>c.obl)),e=document.querySelector('.p-pass .p-en');if(e)e.innerHTML='<b>'+C.length+'</b> громад у '+O.size+' областях'}catch(e){}}
      if(!b||!nv)setTimeout(put,400)}put()})()<\/script>`}
  const i=html.lastIndexOf('</body>');const add=note+exp+sw;html=i>0?html.slice(0,i)+add+html.slice(i):html+add;
  const hd='<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#17714A"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Портал">',j=html.indexOf('<head>');html=j>=0?html.slice(0,j+6)+hd+html.slice(j+6):hd+html;
  document.open();document.write(html);document.close()}
$('f').onsubmit=ev=>{ev.preventDefault();login($('pw').value)};
if(!window.crypto||!crypto.subtle||!window.indexedDB){$('e').textContent='Браузер не підтримує захищене зберігання. Відкрийте через https у сучасному браузері.'}
else{$('b').disabled=true;st('Відкриваю…');start().catch(x=>{ask('Вхід за паролем.');$('e').textContent=String(x&&x.message||x)})}
</script></body></html>
